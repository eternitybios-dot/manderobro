ing:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);width:fit-content}.meter-label{font-size:.62rem;letter-spacing:.22em;color:var(--mist)}.meter-value{font-family:var(--font-display);font-size:.95rem;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}.hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:4;text-align:center;pointer-events:none;opacity:0;animation:hint-fade 4.5s ease forwards}.hint p{margin:0;font-size:.95rem;letter-spacing:.08em;text-shadow:0 6px 24px rgba(0,0,0,.7)}.hint-sub{margin-top:8px!important;font-size:.78rem!important;color:var(--mist)}@keyframes hint-fade{0%,55%{opacity:1}to{opacity:0}}.dock{position:absolute;left:12px;right:12px;bottom:calc(14px + var(--safe-bottom));z-index:6;display:flex;flex-direction:column;gap:12px;padding:14px 14px 12px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,#0a1c24c7,#041015e6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow);animation:rise-in 1.05s .15s cubic-bezier(.22,1,.36,1) both}.controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}.ctl{-webkit-appearance:none;-moz-appearance:none;appearance:none;border:1px solid var(--line);border-radius:20px;background:#e8f7f40a;color:var(--foam);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font:inherit;transition:transform .18s ease,background .18s ease,border-color .18s ease}.ctl:active{transform:scale(.97)}.ctl-primary{background:linear-gradient(160deg,#3de0c547,#f0b45a29);border-color:#3de0c573}.ctl-primary[aria-pressed=false]{background:#e8f7f40a;border-color:var(--line)}.ctl-icon{font-size:1.15rem;line-height:1}.ctl-label{font-size:.72rem;letter-spacing:.12em}.speed-panel{padding:0 2px 2px}.speed-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}.speed-title{margin:0;font-size:.72rem;letter-spacing:.22em;color:var(--mist)}.speed-value{margin:0;font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:.04em;color:var(--aqua);font-variant-numeric:tabular-nums}.speed-slider{-webkit-appearance:none;-moz-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}.speed-slider:focus{outline:none}.speed-slider::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:linear-gradient(90deg,#3de0c533,#f0b45a8c,#ff6b5ab3)}.speed-slider::-webkit-slider-thumb{-webkit-appearance:none;-moz-appearance:none;appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;border:2px solid var(--foam);background:radial-gradient(circle at 35% 35%,#fff,var(--aqua));box-shadow:0 0 0 6px #3de0c52e,0 8px 20px #00000059;cursor:grab}.speed-slider::-moz-range-track{height:8px;border-radius:999px;background:linear-gradient(90deg,#3de0c533,#f0b45a8c,#ff6b5ab3)}.speed-slider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;border:2px solid var(--foam);background:radial-gradient(circle at 35% 35%,#fff,var(--aqua));box-shadow:0 0 0 6px #3de0c52e,0 8px 20px #00000059;cursor:grab}.speed-marks{display:flex;justify-content:space-between;margin-top:8px;font-size:.65rem;letter-spacing:.12em;color:#e8f7f473}@keyframes rise-in{0%{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(min-width:768px){.dock{max-width:420px;left:50%;right:auto;transform:translate(-50%)}}

</style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl" aria-label="マンデルブロ集合"></canvas>
      <div class="aim" id="aim" aria-hidden="true"></div>

      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="top">
        <div class="brand">
          <p class="brand-mark">深層</p>
          <p class="brand-sub">SHINSO · MANDELBROT</p>
        </div>
        <button type="button" class="icon-btn" id="paletteBtn" aria-label="配色を変える" title="配色">
          <span class="swatch" id="swatch"></span>
        </button>
      </header>

      <div class="hud">
        <div class="meter">
          <span class="meter-label">ZOOM</span>
          <span class="meter-value" id="zoomLabel">×1</span>
        </div>
        <div class="meter">
          <span class="meter-label">DEPTH</span>
          <span class="meter-value" id="iterLabel">200</span>
        </div>
      </div>

      <div class="hint" id="hint">
        <p>画面をタップして、拡大する場所を選ぶ</p>
        <p class="hint-sub">ひとつの映像のまま、途切れず深く潜ります</p>
      </div>

      <p class="limit-note" id="limitNote" hidden></p>

      <footer class="dock">
        <section class="speed-panel" aria-label="拡大スピード">
          <div class="speed-head">
            <p class="speed-title">SPEED</p>
            <p class="speed-value" id="speedLabel">×1.0</p>
          </div>
          <input
            type="range"
            class="speed-slider"
            id="speedSlider"
            min="0"
            max="100"
            value="28"
            step="1"
            aria-label="拡大スピード"
          />
          <div class="speed-marks">
            <span>停止</span>
            <span>ゆっくり</span>
            <span>最速</span>
          </div>
        </section>

        <div class="controls">
          <button type="button" class="ctl" id="resetBtn" aria-label="全体に戻る">
            <span class="ctl-icon">↺</span>
            <span class="ctl-label">戻る</span>
          </button>
          <button type="button" class="ctl ctl-primary" id="autoBtn" aria-pressed="true">
            <span class="ctl-icon" id="autoIcon">◈</span>
            <span class="ctl-label" id="autoLabel">自動拡大</span>
          </button>
          <button type="button" class="ctl" id="paletteCtlBtn" aria-label="配色を変える">
            <span class="ctl-icon">◐</span>
            <span class="ctl-label">配色</span>
          </button>
        </div>
      </footer>
    </div>
  </body>
</html>
